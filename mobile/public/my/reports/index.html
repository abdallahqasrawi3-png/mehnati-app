<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مهنتي</title>
  <!-- Static hosts without rewrite rules: open the app at "/" and let it restore the requested page. -->
  <script>
    var path = location.pathname.replace(/\/+$/, '') || '/';
    location.replace('/?r=' + encodeURIComponent(path + location.search + location.hash));
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px; color: #1E5B3E">جارٍ فتح مهنتي…</body>
</html>
